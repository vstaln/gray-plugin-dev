[package]
name = "gray-plugin-dev"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Plugin scaffolding + conformance loop for the gray plugin ecosystem"
license = "MIT"

[lib]
name = "plugin_dev"
path = "src/lib.rs"

[[bin]]
name = "plugin-dev"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
